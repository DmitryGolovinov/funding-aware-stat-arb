[project]
name = "funding-aware-stat-arb"
version = "0.1.0"
description = "Funding-aware relative value on Binance USD-M perpetuals: carry, funding and residual signals, net of costs"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "pandas>=2.2", "pyarrow>=15", "pyyaml>=6", "requests>=2.31", "lightgbm>=4.3", "matplotlib>=3.8", "tabulate>=0.9"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.4"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
ignore = ["E741"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E402"]
